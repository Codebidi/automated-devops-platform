name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to redeploy'
        required: true
        type: string
      deployment_id:
        description: 'Original deployment ID to roll back to'
        required: true
        type: string

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
  APP_PORT: ${{ vars.APP_PORT || '5000' }}

jobs:
  rollback:
    name: Execute Production Rollback
    runs-on: ubuntu-latest
    steps:
      - name: Validate Image Tag Input
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "::error::Repository variable ECR_REPOSITORY is empty. Set vars.ECR_REPOSITORY in GitHub Variables."
            exit 1
          fi
          if [[ ! "$INPUT_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid image tag format: $INPUT_TAG"
            exit 1
          fi
          echo "IMAGE_TAG=$INPUT_TAG" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify Image Exists in ECR
        env:
          ECR_REGISTRY_VAL: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FULL_URI="${ECR_REGISTRY_VAL}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "IMAGE_URI=${FULL_URI}" >> $GITHUB_ENV
          if ! aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "::error::Image tag '${IMAGE_TAG}' does not exist in ECR repository '${ECR_REPOSITORY}'."
            echo "DEPLOY_STATUS=failed" >> $GITHUB_ENV
            echo "DEPLOY_HEALTH=unknown" >> $GITHUB_ENV
            exit 1
          fi
          echo "Verified image exists in ECR: ${FULL_URI}"

      - name: Redeploy Image to EC2 and Health Check
        id: redeploy
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_KEY" > deploy_key.pem && chmod 600 deploy_key.pem

          ssh -o StrictHostKeyChecking=no -i deploy_key.pem "${EC2_USER}@${EC2_HOST}" \
            "docker pull ${IMAGE_URI} && \
             docker stop app-temp || true && \
             docker rm -f app-rollback || true && \
             docker run -d --name app-rollback -e PORT=${APP_PORT} -p ${APP_PORT}:${APP_PORT} ${IMAGE_URI}"

          echo "Verifying health of rolled-back container on port ${APP_PORT}..."
          HEALTHY=false
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${EC2_HOST}:${APP_PORT}/health" || true)
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              HEALTHY=true
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "Rollback health probe passed."
            ssh -o StrictHostKeyChecking=no -i deploy_key.pem "${EC2_USER}@${EC2_HOST}" \
              "docker rm -f app-live || true && docker rename app-rollback app-live"
            echo "DEPLOY_STATUS=success" >> $GITHUB_ENV
            echo "DEPLOY_HEALTH=healthy" >> $GITHUB_ENV
          else
            echo "Rollback container failed health probe!"
            ssh -o StrictHostKeyChecking=no -i deploy_key.pem "${EC2_USER}@${EC2_HOST}" \
              "docker rm -f app-rollback || true"
            echo "DEPLOY_STATUS=failed" >> $GITHUB_ENV
            echo "DEPLOY_HEALTH=unhealthy" >> $GITHUB_ENV
            exit 1
          fi

      - name: Post Signed Webhook to Dashboard
        if: always()
        continue-on-error: true
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_API_URL }}
          DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::warning::Skipping dashboard notification: DASHBOARD_API_URL or WEBHOOK_SECRET is not configured."
            exit 0
          fi

          STATUS="${DEPLOY_STATUS:-failed}"
          HEALTH="${DEPLOY_HEALTH:-unknown}"

          BODY=$(jq -n \
            --arg image_tag "${IMAGE_TAG:-unknown}" \
            --arg image_uri "${IMAGE_URI:-}" \
            --arg status "$STATUS" \
            --arg health "$HEALTH" \
            --arg rolled_back_from "$DEPLOYMENT_ID" \
            --arg author "$ACTOR" \
            --arg commit_message "Production rollback to ${IMAGE_TAG:-unknown}" \
            '{image_tag: $image_tag, image_uri: $image_uri, status: $status, health: $health, rolled_back_from: $rolled_back_from, author: $author, commit_message: $commit_message}')

          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')

          DELIVERED=false
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 15 -X POST "${DASHBOARD_URL%/}/api/webhooks/deployment" \
              -H "Content-Type: application/json" \
              -H "X-Signature-256: sha256=$SIG" \
              -d "$BODY"; then
              DELIVERED=true
              echo "Rollback webhook delivered on attempt $attempt."
              break
            fi
            echo "::warning::Rollback webhook attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done

          if [ "$DELIVERED" != "true" ]; then
            echo "::warning::Could not reach dashboard at ${DASHBOARD_URL} after 3 attempts."
          fi

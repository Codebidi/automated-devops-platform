name: deployhub

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deployhub
      POSTGRES_DB: deployhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/cicd_api/sql/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub -d deployhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://deployhub:${POSTGRES_PASSWORD}@db:5432/deployhub
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      USE_MOCK: ${USE_MOCK:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      API_KEY: ${API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_WORKFLOW_FILE: ${GITHUB_WORKFLOW_FILE:-deploy.yml}
      ROLLBACK_WORKFLOW_FILE: ${ROLLBACK_WORKFLOW_FILE:-rollback.yml}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ECR_REPOSITORY: ${ECR_REPOSITORY:-}
      EC2_HOST: ${EC2_HOST:-}
      APP_HEALTH_URL: ${APP_HEALTH_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/api/health',timeout=4); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./cicd-dashboard
      args:
        VITE_API_URL: /api
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
